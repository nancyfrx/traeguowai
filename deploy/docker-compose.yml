version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: traeguowai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./www:/usr/share/nginx/html
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - blog-backend
      - test-platform-backend
    networks:
      - traeguowai-network

  blog-backend:
    build:
      context: ../web/blog/backend
      dockerfile: Dockerfile
    container_name: blog-backend
    environment:
      - SPRING_DATASOURCE_URL=${BLOG_DB_URL:-jdbc:mysql://mysql:3306/blog_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
      - SPRING_DATASOURCE_USERNAME=${BLOG_DB_USERNAME:-root}
      - SPRING_DATASOURCE_PASSWORD=${BLOG_DB_PASSWORD:-rootpassword}
    
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - mysql
    networks:
      - traeguowai-network

  test-platform-backend:
    build:
      context: ../web/test_platform/backend
      dockerfile: Dockerfile
    container_name: test-platform-backend
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=${DB_URL:-jdbc:mysql://mysql:3306/test_platform_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-root}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-rootpassword}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - SMTP_HOST=${SMTP_HOST:-smtp.163.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    depends_on:
      - mysql
    networks:
      - traeguowai-network

  mysql:
    image: mysql:8.0
    container_name: traeguowai-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - traeguowai-network

networks:
  traeguowai-network:
    driver: bridge

volumes:
  mysql-data:
